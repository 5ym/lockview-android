apply plugin: 'com.android.application'

android {
    namespace = 'io.doany.lockview'
    // androidx のライブラリが API 37 以上でのコンパイルを要求するため。
    compileSdk = 37

    defaultConfig {
        applicationId = "io.doany.lockview"
        minSdk = 24
        targetSdk = 36
        // リリース時は CI からタグと実行番号を渡す。
        versionCode = (project.findProperty('appVersionCode') ?: '1') as Integer
        versionName = project.findProperty('appVersionName') ?: '1.0'

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    // 署名情報は環境変数から受け取る。未設定ならリリースAPKは未署名になる。
    signingConfigs {
        release {
            def keystore = System.getenv('RELEASE_KEYSTORE')
            if (keystore) {
                storeFile = file(keystore)
                storePassword = System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias = System.getenv('RELEASE_KEY_ALIAS')
                keyPassword = System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('RELEASE_KEYSTORE')) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
}

dependencies {
    // AppCompatActivity と AlertDialog
    implementation 'androidx.appcompat:appcompat:1.8.0'
    // WindowCompat / WindowInsetsControllerCompat / ContextCompat
    implementation 'androidx.core:core:1.19.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
